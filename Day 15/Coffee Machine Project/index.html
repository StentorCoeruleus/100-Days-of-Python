<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Machine</title>
  <!-- Pyodide: Python running in the browser -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f6f1eb;
      color: #3b2a1e;
    }
    h1 { margin-bottom: 4px; }
    button {
      font-size: 1rem;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #6f4e37;
      color: white;
      cursor: pointer;
    }
    button[hidden] { display: none; }
    #screen {
      background: #1e1e1e;
      color: #e8e8e8;
      font-family: Consolas, "Courier New", monospace;
      font-size: 15px;
      padding: 16px;
      border-radius: 6px;
      min-height: 300px;
      max-height: 60vh;
      overflow-y: auto;
      margin: 16px 0;
      cursor: text;
    }
    #terminal { white-space: pre-wrap; }
    .user-input { color: #f0c27b; }
    #input-line {
      display: flex;
      align-items: center;
    }
    #input-line[hidden] { display: none; }
    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f0c27b;
      font: inherit;
      caret-color: #f0c27b;
    }
  </style>
</head>
<body>
  <h1>☕ Coffee Machine</h1>
  <p>Day 15 of 100 Days of Code: The Complete Python Pro Bootcamp.
     Type your answers into the black box and press <b>Enter</b>.
     Type <code>report</code> to see the machine's resources, or <code>off</code> to switch it off.</p>

  <div id="screen">
    <div id="terminal">Loading Python, this can take a few seconds...</div>
    <div id="input-line" hidden>
      <span>&gt;&nbsp;</span>
      <input id="input" type="text" autocomplete="off" spellcheck="false" aria-label="Your answer">
    </div>
  </div>

  <button id="restart" hidden>Restart coffee machine</button>

  <script>
    const screenBox = document.getElementById("screen");
    const terminal = document.getElementById("terminal");
    const inputLine = document.getElementById("input-line");
    const inputBox = document.getElementById("input");
    const restartButton = document.getElementById("restart");
    let sinceLastInput = "";

    // Adds text to the black box and scrolls to the bottom
    function writeOutput(text, className) {
      const span = document.createElement("span");
      span.textContent = text;
      if (className) span.className = className;
      terminal.appendChild(span);
      sinceLastInput += text;
      screenBox.scrollTop = screenBox.scrollHeight;
    }

    // Clicking anywhere in the black box puts the cursor in the input box
    screenBox.addEventListener("click", () => {
      if (!inputLine.hidden) inputBox.focus();
    });

    // Shows the input box and waits until the user presses Enter
    function waitForInput() {
      return new Promise((resolve) => {
        inputLine.hidden = false;
        inputBox.focus();
        screenBox.scrollTop = screenBox.scrollHeight;
        inputBox.addEventListener("keydown", function onKey(event) {
          if (event.key !== "Enter") return;
          inputBox.removeEventListener("keydown", onKey);
          const answer = inputBox.value;
          inputBox.value = "";
          inputLine.hidden = true;
          writeOutput("> " + answer + "\n", "user-input");
          sinceLastInput = "";
          resolve(answer);
        });
      });
    }

    // Backup for browsers that can't pause Python (uses a pop-up instead)
    function promptFallback() {
      const answer = window.prompt(sinceLastInput);
      sinceLastInput = "";
      if (answer === null) return null;  // Cancel pressed
      writeOutput("> " + answer + "\n", "user-input");
      return answer;
    }

    async function main() {
      const pyodide = await loadPyodide();

      // Send Python's print() output to the black box
      pyodide.setStdout({ batched: (line) => writeOutput(line + "\n") });
      pyodide.setStderr({ batched: (line) => writeOutput(line + "\n") });

      // Copy main.py into Pyodide's virtual file system
      const response = await fetch("main.py");
      if (!response.ok) {
        throw new Error(`Couldn't load main.py (status ${response.status})`);
      }
      pyodide.FS.writeFile("/home/pyodide/main.py", await response.text());

      // Replace Python's input() with one that uses the input box
      pyodide.runPython(`
import builtins

import js
from pyodide.ffi import run_sync


def browser_input(prompt=""):
    js.writeOutput(prompt)
    if hasattr(js.WebAssembly, "Suspending"):
        return run_sync(js.waitForInput())
    answer = js.promptFallback()
    if answer is None:
        raise EOFError
    return answer


builtins.input = browser_input
`);

      async function runMachine() {
        restartButton.hidden = true;
        terminal.textContent = "";
        sinceLastInput = "";
        try {
          // Runs main.py from the start, so the machine is fully restocked
          await pyodide.runPythonAsync(`
import runpy
try:
    runpy.run_path("/home/pyodide/main.py", run_name="__main__")
except EOFError:
    pass
`);
          writeOutput("\nMachine switched off.\n");
        } catch (error) {
          writeOutput(`\nError: ${error}\n`);
        }
        restartButton.hidden = false;
      }

      restartButton.addEventListener("click", runMachine);
      runMachine();
    }

    main().catch((error) => writeOutput(`\nError: ${error}\n`));
  </script>
</body>
</html>
