<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Machine</title>
  <!-- Pyodide: Python 3.12 running in the browser -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f6f1eb;
      color: #3b2a1e;
    }
    h1 { margin-bottom: 4px; }
    button {
      font-size: 1rem;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #6f4e37;
      color: white;
      cursor: pointer;
    }
    button:disabled { background: #b9a596; cursor: not-allowed; }
    #output {
      background: #1e1e1e;
      color: #e8e8e8;
      font-family: Consolas, monospace;
      padding: 16px;
      border-radius: 6px;
      min-height: 200px;
      white-space: pre-wrap;
      margin-top: 16px;
    }
    .user-input { color: #f0c27b; }
  </style>
</head>
<body>
  <h1>☕ Coffee Machine</h1>
  <p>Day 15 of 100 Days of Code: The Complete Python Pro Bootcamp.
     Answer each question in the pop-up box. Type <code>report</code> to see resources,
     or <code>off</code> (or press Cancel) to switch the machine off.</p>

  <button id="start" disabled>Loading Python…</button>
  <div id="output"></div>

  <script>
    const output = document.getElementById("output");
    const startButton = document.getElementById("start");

    // Lines printed since the last question, shown inside the pop-up
    // (the page can't redraw while a pop-up is open).
    let pendingLines = [];

    function addToOutput(text, className) {
      const line = document.createElement("div");
      line.textContent = text;
      if (className) line.className = className;
      output.appendChild(line);
    }

    async function main() {
      const pyodide = await loadPyodide();

      // Send everything Python prints to the page.
      pyodide.setStdout({
        batched: (text) => {
          addToOutput(text);
          pendingLines.push(text);
        },
      });

      // Every input() in Python opens a pop-up box.
      pyodide.setStdin({
        stdin: () => {
          const answer = window.prompt(pendingLines.join("\n"));
          pendingLines = [];
          if (answer === null) return undefined; // Cancel pressed: end the program
          addToOutput("> " + answer, "user-input");
          return answer;
        },
      });

      // Load main.py from the same folder as this page.
      const code = await (await fetch("main.py")).text();

      startButton.textContent = "Start coffee machine";
      startButton.disabled = false;

      startButton.addEventListener("click", () => {
        output.innerHTML = "";
        pendingLines = [];
        startButton.disabled = true;
        try {
          pyodide.runPython(code);
          addToOutput("Machine switched off.");
        } catch (error) {
          if (String(error).includes("EOFError")) {
            addToOutput("Machine switched off.");
          } else {
            addToOutput(String(error));
          }
        }
        startButton.textContent = "Restart coffee machine";
        startButton.disabled = false;
      });
    }

    main();
  </script>
</body>
</html>
